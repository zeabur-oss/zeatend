name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally, except docs, which
# runs the website's check of docs/ (locally: bun scripts/docs-check.ts <this checkout> in the
# website). The nightly run keeps main's caches current for the merge queue.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
        with:
          rust-cache: true
      - parallel:
          - name: Static checks
            run: nix develop -c scripts/ci/lint.sh static
          - name: Cargo checks
            run: nix develop -c scripts/ci/lint.sh cargo

  test:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/test.sh

  # Installs each distribution on a fresh runner and runs the cluster tests. A GitHub runner, not
  # Instabox: zeatend changes the host, and the network policy test needs a policy controller
  # that the host's kernel supports. Not on pull requests: the merge queue runs it.
  cluster:
    name: cluster (${{ matrix.distribution }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        distribution: [k3s, rke2, kubesolo]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
        with:
          rust-cache: true
      # The runner comes with Docker, which a server for zeatend does not have: it sets the
      # FORWARD policy to DROP, and the KubeSolo host check refuses it.
      - name: Remove Docker
        run: |
          sudo systemctl disable --now docker.service docker.socket
          mapfile -t packages < <(dpkg-query -W -f '${Package}\n' | grep -E '^(docker|moby)')
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y "${packages[@]}"
          sudo rm -f /run/docker.sock /var/run/docker.sock
          sudo iptables -P FORWARD ACCEPT
      - run: nix develop -c scripts/ci/cluster.sh ${{ matrix.distribution }}

  docs:
    runs-on: instabox-small
    timeout-minutes: 10
    steps:
      - uses: zeabur-oss/website/.github/actions/docs-check@a87b42163152b49e81886eb222e1853388f80d1e # main

  # The check rulesets require.
  ok:
    name: ci / ok
    if: always()
    needs: [lint, test, cluster, docs]
    runs-on: instabox-small
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
