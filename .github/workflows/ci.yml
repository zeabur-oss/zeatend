name: CI

# Each job runs scripts/ci/<job>.sh in the Nix dev shell, the same as locally. The nightly run
# keeps main's caches current for the merge queue.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
        with:
          rust-cache: true
      - parallel:
          - name: Static checks
            run: nix develop -c scripts/ci/lint.sh static
          - name: Cargo checks
            run: nix develop -c scripts/ci/lint.sh cargo

  test:
    runs-on: instabox-medium
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@f3ae87d7ef3c37447432e398200d200b546dfa46 # main
        with:
          rust-cache: true
      - run: nix develop -c scripts/ci/test.sh

  # The check rulesets require.
  ok:
    name: ci / ok
    if: always()
    needs: [lint, test]
    runs-on: instabox-small
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
