name: Release

# Tag vX.Y.Z or vX.Y.Z-<pre-release> on main: build zeatend on both architectures, create the draft
# release with the archives and their signed checksums, and verify the draft. A maintainer
# publishes the draft. Manual run: rehearse, which builds and publishes nothing.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, as in Cargo.toml (v0.1.1); a rehearsal never publishes"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: nix develop --command bash -eo pipefail {0}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  check:
    runs-on: instabox-small
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@0558836e9cf7e00101c99d4fd123276e4a20fe20 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - name: The version is the crate's, with a CHANGELOG.md section, on main
        run: |
          crate=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "zeatend") | .version')
          bun x zeabur-oss-release check-tag "$VERSION" --changelog CHANGELOG.md --version "$crate" \
            ${{ github.event_name != 'push' && '--rehearsal' || '' }}

  build:
    name: build (${{ matrix.arch }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@0558836e9cf7e00101c99d4fd123276e4a20fe20 # main
      - name: Build
        run: scripts/release-build.sh "$VERSION" "${{ matrix.arch }}" dist
        env:
          # The experience program's PostHog key goes only into tagged releases.
          ZEATEND_TELEMETRY_KEY: ${{ github.event_name == 'push' && vars.POSTHOG_KEY || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zeatend-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: instabox-small
    timeout-minutes: 30
    permissions:
      contents: write # the draft
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zeabur-oss/.github/actions/ci-setup@0558836e9cf7e00101c99d4fd123276e4a20fe20 # main
      - name: Install the packages
        run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: zeatend-*
          path: assets
          merge-multiple: true
      - name: Stop if the release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun x zeabur-oss-release unpublished "$VERSION"
      - uses: zeabur-oss/.github/actions/release-draft@0558836e9cf7e00101c99d4fd123276e4a20fe20 # main
        with:
          version: ${{ env.VERSION }}
          name: Zeabur Zeatend

  verify:
    name: verify (${{ matrix.arch }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-26.04 }
          - { arch: arm64, runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      # GitHub shows a draft release only to a token that can push.
      contents: write
      attestations: read
    steps:
      - uses: zeabur-oss/.github/actions/release-verify@0558836e9cf7e00101c99d4fd123276e4a20fe20 # main
        with:
          version: ${{ env.VERSION }}
      - name: Run zeatend as a user gets it
        run: |
          mkdir unpacked
          tar -xzf "downloaded/zeatend-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C unpacked
          # Outside the dev shell: the archive must run on a plain host.
          env -i unpacked/zeatend --version
