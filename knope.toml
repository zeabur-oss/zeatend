# Change files in .changeset/ and release pull requests (CONTRIBUTING.md).
[package]
versioned_files = [
  "Cargo.toml",
  { path = "Cargo.lock", dependency = "zeatend" },
  { path = "Cargo.lock", dependency = "zeatend-host" },
  { path = "Cargo.lock", dependency = "zeatend-plan" },
]
changelog = "CHANGELOG.md"

[changes]
ignore_conventional_commits = true

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"
